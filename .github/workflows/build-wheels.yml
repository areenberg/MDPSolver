name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "CPP_Source_Code/**"
      - "Python/**"
      - ".github/workflows/build-wheels.yml"
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel runner, macos-14 = Apple Silicon runner.
        # Each builds/tests only its own native architecture, which keeps
        # OpenMP (via Homebrew libomp) simple and avoids cross-compile issues.
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: Python
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          # manylinux2014's GCC (10.2.1) is too old to build recent NumPy
          # from source, and NumPy no longer ships prebuilt wheels for that
          # tag. manylinux_2_28 (AlmaLinux 8, GCC 12+) has current GCC and
          # NumPy still publishes wheels for it. Wheels built against it
          # need glibc >= 2.28 (RHEL8/Ubuntu 18.10/Debian 10 or newer),
          # which covers essentially every machine still updated today.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp:/usr/local/opt/libomp
            MACOSX_DEPLOYMENT_TARGET=14.0
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: >
            python {project}/Python/tests/test1_pip.py &&
            python {project}/Python/tests/test2_pip.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist Python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on tag pushes, never on pull requests or manual test runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
