name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "CPP_Source_Code/**"
      - "Python/**"
      - "pyproject.toml"
      - ".github/workflows/build-wheels.yml"
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Safety net: Linux and Windows build+test all 6 Python versions well
    # under this, so a job still running past it is stuck, not just slow.
    # Without this, a genuine hang runs until the (much longer) GitHub
    # Actions default job timeout instead of failing fast and visibly.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon (arm64) only. Intel macOS is
        # intentionally not built - a deliberate scope decision, not a
        # limitation we hit. Users on Intel Macs get the sdist and need a
        # C++ compiler to install (pip fetches CMake if it is missing;
        # without libomp the module runs serially). (macos-14 was used
        # until GitHub retired it on 2026-11-02.)
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      # The project (pyproject.toml) is the repository root
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          # manylinux2014's GCC (10.2.1) is too old to build recent NumPy
          # from source, and NumPy no longer ships prebuilt wheels for that
          # tag. manylinux_2_28 (AlmaLinux 8, GCC 12+) has current GCC and
          # NumPy still publishes wheels for it. Wheels built against it
          # need glibc >= 2.28 (RHEL8/Ubuntu 18.10/Debian 10 or newer),
          # which covers essentially every machine still updated today.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          # Homebrew's libomp is built for the macOS version of the runner,
          # and the wheel bundles it, so the deployment target must be that
          # version (delocate refuses a lower one). The macOS wheels
          # therefore need macOS 15 or newer.
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp
            MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_TEST_REQUIRES: numpy
          # cibuildwheel copies Python/tests into the temporary folder the
          # tests run in. With no Python/src next to them there, the tests
          # import the installed wheel as a whole (see
          # Python/tests/loadmdpsolver.py), and each one ends with a line
          # saying so.
          CIBW_TEST_SOURCES: Python/tests
          CIBW_TEST_COMMAND: >
            python Python/tests/test_imports.py &&
            python Python/tests/test_vi.py &&
            python Python/tests/test_pi.py &&
            python Python/tests/test_mpi.py &&
            python Python/tests/test_random.py &&
            python Python/tests/test_large.py &&
            python Python/tests/test_reuse.py &&
            python Python/tests/test_order.py &&
            python Python/tests/test_output.py &&
            python Python/tests/test_checkmodel.py &&
            python Python/tests/test_arrays.py &&
            python Python/tests/test_threads.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sdist holds the C++ as well as the Python package (see
      # sdist.exclude in pyproject.toml for what it leaves out)
      - run: pipx run build --sdist --outdir dist
      # Install from the sdist, as pip does where no wheel fits, and run the
      # tests on it from a folder outside the repository, so that they test
      # the installed package as a whole (see Python/tests/loadmdpsolver.py).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test the sdist
        run: |
          python -m pip install dist/*.tar.gz numpy
          mkdir "$RUNNER_TEMP/sdisttest"
          cp -r Python/tests "$RUNNER_TEMP/sdisttest/"
          cd "$RUNNER_TEMP/sdisttest/tests"
          for test in test_*.py; do python "$test" || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on tag pushes, never on pull requests or manual test runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
